
<!DOCTYPE html>
<html>
<head>
    <title>Online Food Ordering</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #e63946;
            color: white;
            text-align: center;
            padding: 20px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .menu {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
            padding: 20px;
        }

        .food-item {
            background-color: white;
            width: 250px;
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        .food-item img {
            width: 220px;
            height: 160px;
            border-radius: 10px;
            object-fit: cover;
        }

        .food-item h3 {
            color: #333;
        }

        .price {
            color: green;
            font-size: 20px;
            font-weight: bold;
        }

        button {
            background-color: #e63946;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Foodie's Restaurant</h1>
        <p>Delicious Food at Your Doorstep!</p>
    </header>

    <h2>Our Food Menu</h2>

    <div class="menu">

        <div class="food-item">
            <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500" alt="Burger">
            <h3>Cheese Burger</h3>
            <p class="price">₹150</p>
            <button>Order Now</button>
        </div>

        <div class="food-item">
            <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500" alt="Pizza">
            <h3>Pizza</h3>
            <p class="price">₹250</p>
            <button>Order Now</button>
        </div>

        <div class="food-item">
            <img src="https://images.unsplash.com/photo-1603133872878-684f208fb84b?w=500" alt="Fried Rice">
            <h3>Chicken Fried Rice</h3>
            <p class="price">₹180</p>
            <button>Order Now</button>
        </div>

        <div class="food-item">
            <img src="https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=500" alt="Noodles">
            <h3>Veg Noodles</h3>
            <p class="price">₹120</p>
            <button>Order Now</button>
        </div>

        <div class="food-item">
            <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500" alt="Salad">
            <h3>Fresh Salad</h3>
            <p class="price">₹100</p>
            <button>Order Now</button>
        </div>

        <div class="food-item">
            <img src="https://images.unsplash.com/photo-1563805042-7684c019e1cb?w=500" alt="Ice Cream">
            <h3>Ice Cream</h3>
            <p class="price">₹80</p>
            <button>Order Now</button>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 Foodie's Restaurant. All Rights Reserved.</p>
    </footer>

</body>
</html>
